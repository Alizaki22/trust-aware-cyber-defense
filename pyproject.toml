[project]
name = "fine-tuned-multi-agent-ai-for-cyber-defense"
version = "0.1.0"
description = "Academic prototype for trust-aware multi-agent cybersecurity analysis, verification, and simulated recommendations."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
